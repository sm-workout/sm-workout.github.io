<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Allenamento</title>
<style>
:root{
  /* superfici */
  --bg:#0b0e14; --surface:#141a24; --surface2:#1b2331;
  --line:#232c3a; --line2:#334054;
  /* testo: tre livelli, mai di più */
  --tx:#eef2f8; --tx2:#aeb9c9; --tx3:#6f7a8b;
  /* accenti con un ruolo preciso ciascuno */
  --acc:#4dd4c4;      /* dose, timer, stato attivo */
  --blue:#8aacff;     /* lato / indicatori di posizione */
  --amber:#ffb454;    /* consigli */
  --red:#ff7b7b;      /* errore tipico */
  /* tipografia — scala 1.26 */
  --tD:2.6rem; --t1:1.95rem; --t2:1.5rem; --tL:1.12rem;
  --tB:.95rem; --tS:.82rem; --tXS:.72rem;
  /* spaziatura — scala 4 */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:44px;
  --r:14px; --rL:20px;
  --fs:1;
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:calc(20px * var(--fs))}
body{
  height:100%;background:var(--bg);color:var(--tx);
  font-family:"Segoe UI",Roboto,system-ui,-apple-system,sans-serif;
  font-size:var(--tB);line-height:1.45;overflow:hidden;-webkit-font-smoothing:antialiased;
}
html{height:100%}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer;line-height:inherit}
.safe{position:absolute;inset:3% 3.5%;display:flex;flex-direction:column}

/* ---------- FOCUS ---------- */
.f{transition:border-color .14s,background .14s,transform .14s}
.f:focus{outline:none}
.f:focus-visible{outline:none}

/* ---------- SCREENS ---------- */
.screen{display:none;height:100%;flex-direction:column}
.screen.on{display:flex}

/* ---------- HEADER comune ---------- */
.hdr{display:flex;align-items:baseline;gap:var(--s4);
  padding-bottom:var(--s3);border-bottom:1px solid var(--line);flex:none}
.eyebrow{font-size:var(--tXS);font-weight:800;letter-spacing:.16em;
  text-transform:uppercase;color:var(--tx3)}
.meta{margin-left:auto;font-size:var(--tXS);font-weight:800;
  letter-spacing:.1em;color:var(--tx3)}

/* ---------- HOME ---------- */
.hero{flex:none;padding:var(--s7) 0 var(--s6)}
.hero h1{font-size:var(--tD);font-weight:800;letter-spacing:-.03em;line-height:1}
.hero .sub{margin-top:var(--s3);font-size:var(--tS);font-weight:800;
  letter-spacing:.14em;text-transform:uppercase;color:var(--tx3)}
.hero .sub b{color:var(--acc)}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:var(--s4);align-content:start}
.tile{position:relative;overflow:hidden;text-align:left;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--rL);
  padding:var(--s5);display:flex;flex-direction:column;gap:var(--s2)}
.tile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:transparent}
.tile.sug::before{background:var(--acc)}
.tile .kicker{font-size:var(--tXS);font-weight:800;letter-spacing:.16em;
  text-transform:uppercase;color:var(--tx3)}
.tile.sug .kicker{color:var(--acc)}
.tile .t{font-size:var(--t2);font-weight:800;letter-spacing:-.015em;line-height:1.15}
.tile .s{font-size:var(--tS);color:var(--tx3);line-height:1.5}
.tile:focus{border-color:var(--acc);background:var(--surface2);transform:translateY(-2px)}

/* ---------- LISTA ---------- */
.list{flex:1;min-height:0;overflow:auto;display:grid;
  grid-template-columns:repeat(4,1fr);grid-auto-rows:minmax(6.2rem,auto);gap:var(--s3);
  align-content:start;padding:var(--s5) 2px var(--s4)}
.row{position:relative;text-align:left;display:flex;flex-direction:column;gap:var(--s2);
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:var(--s4);min-height:min-content}
.row .n{font-size:var(--tXS);font-weight:800;letter-spacing:.1em;color:var(--tx3)}
.row .nm{font-size:var(--tB);font-weight:700;line-height:1.3;color:var(--tx)}
.row .ds{margin-top:auto;font-size:var(--tXS);font-weight:800;color:var(--acc);letter-spacing:.01em}
.row:focus{border-color:var(--acc);background:var(--surface2);transform:translateY(-2px)}

/* ---------- ESERCIZIO ---------- */
.bars{display:flex;gap:3px;padding:var(--s3) 0 0;flex:none}
.bars i{height:3px;flex:1;background:var(--line);border-radius:2px}
.bars i.done{background:var(--line2)}
.bars i.now{background:var(--acc);height:5px;margin-top:-1px}

.body{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,33%) 1fr;
  gap:var(--s6);padding:var(--s5) 0}
.figwrap{border:1px solid var(--line);border-radius:var(--rL);padding:var(--s4);
  background:radial-gradient(circle at 50% 42%,var(--surface2) 0%,var(--surface) 68%);
  display:grid;place-items:center;min-height:0}
.figwrap svg{width:100%;height:100%;max-height:100%}

.info{display:flex;flex-direction:column;gap:var(--s3);min-height:0;overflow:hidden;font-size:var(--tB)}
.info h2{font-size:2.05em;font-weight:800;line-height:1.08;letter-spacing:-.025em}
.dose{font-size:1.18em;font-weight:800;color:var(--acc);letter-spacing:-.005em;margin-top:calc(var(--s1) * -1)}
.target{font-size:.86em;color:var(--tx3);letter-spacing:.01em;margin-top:calc(var(--s1) * -1)}
.target b{color:var(--blue);font-weight:800;letter-spacing:.12em;font-size:.88em}
.cues{list-style:none;display:flex;flex-direction:column;gap:var(--s2);margin-top:var(--s1)}
.cues li{position:relative;padding-left:var(--s5);font-size:1em;
  color:var(--tx2);line-height:1.45}
.cues li::before{content:"";position:absolute;left:var(--s2);top:.62em;
  width:5px;height:5px;background:var(--line2);border-radius:99px}
.cues li b{color:var(--tx);font-weight:800}
.err,.tip{border-radius:0 var(--r) var(--r) 0;padding:var(--s3) var(--s4);
  font-size:.86em;line-height:1.45;color:var(--tx2)}
.err{background:rgba(255,123,123,.07);border-left:3px solid var(--red)}
.err b{color:var(--red);font-weight:800}
.tip{background:rgba(255,180,84,.07);border-left:3px solid var(--amber)}
.tip b{color:var(--amber);font-weight:800}
.fix{border-radius:0 var(--r) var(--r) 0;padding:var(--s3) var(--s4);font-size:.86em;
  line-height:1.45;color:var(--tx2);background:rgba(77,212,196,.08);border-left:3px solid var(--acc)}
.fix b{color:var(--acc);font-weight:800}
.fix .lab{display:block;font-size:.82em;font-weight:800;letter-spacing:.14em;
  text-transform:uppercase;color:var(--acc);margin-bottom:.3em}

/* barra di stato + comandi */
.bar{flex:none;display:flex;align-items:center;gap:var(--s5);
  padding-top:var(--s4);border-top:1px solid var(--line)}
.status{display:flex;align-items:center;gap:var(--s4);min-width:0}
.clock{font-size:2.9rem;font-weight:800;font-variant-numeric:tabular-nums;
  letter-spacing:-.045em;line-height:1;color:var(--tx3);min-width:2.6em}
.clock.run{color:var(--acc)}
.clock.rest{color:var(--amber)}
.clock.done{color:var(--acc)}
.side{font-size:var(--tS);font-weight:800;letter-spacing:.12em;color:var(--blue)}
.sets{display:flex;gap:var(--s1);margin-top:var(--s1)}
.sets i{width:.7rem;height:.7rem;border-radius:99px;border:2px solid var(--line2);display:block}
.sets i.on{background:var(--acc);border-color:var(--acc)}

.ctrl{display:flex;gap:var(--s2);margin-left:auto;flex-wrap:wrap;justify-content:flex-end;align-items:center}
.btn.key i{font-style:normal;color:var(--blue);font-weight:800;margin-right:.35em}
.btn.nav{display:none}
.clock{cursor:pointer}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:10px;
  padding:var(--s3) var(--s4);font-size:var(--tS);font-weight:700;white-space:nowrap;color:var(--tx2)}
.btn:focus{border-color:var(--acc);background:var(--surface2);color:var(--tx)}
.btn.pri{background:var(--acc);color:#06231f;border-color:var(--acc);font-weight:800}
.btn.pri:focus{background:#6ce6d7;border-color:#6ce6d7;color:#06231f}

/* ---------- DOC ---------- */
.doc{flex:1;min-height:0;overflow:auto;padding:var(--s5) var(--s5) var(--s6) 0;
  max-width:52rem;line-height:1.6;font-size:var(--tB);color:var(--tx2)}
.doc h3{font-size:var(--tL);font-weight:800;color:var(--tx);
  margin:var(--s6) 0 var(--s3);letter-spacing:-.01em}
.doc h3::before{content:"";display:block;width:28px;height:2px;
  background:var(--acc);margin-bottom:var(--s3)}
.doc h3:first-child{margin-top:0}
.doc p{margin-bottom:var(--s3)}
.doc b{color:var(--tx);font-weight:700}
.doc table{width:100%;border-collapse:collapse;margin:var(--s3) 0 var(--s5);font-size:var(--tS)}
.doc td,.doc th{border-bottom:1px solid var(--line);padding:var(--s3) var(--s3) var(--s3) 0;
  text-align:left;vertical-align:top}
.doc th{color:var(--tx3);font-size:var(--tXS);text-transform:uppercase;
  letter-spacing:.12em;font-weight:800;border-bottom-color:var(--line2)}
.doc tr td:first-child{color:var(--tx);font-weight:700;white-space:nowrap;padding-right:var(--s5)}
.doc:focus{outline:none}

/* ---------- SPECCHIO ---------- */
#mirror{position:fixed;inset:0;background:#000;display:none;z-index:99}
#mirror.on{display:block}
#mirror video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.mhud{position:absolute;right:3.5%;top:4%;text-align:right;max-width:56%;
  background:rgba(11,14,20,.72);border:1px solid var(--line2);
  border-radius:var(--r);padding:var(--s3) var(--s4)}
.mhud .a{font-size:var(--tL);font-weight:800;line-height:1.15;color:var(--tx)}
.mhud .b{font-size:var(--tS);font-weight:800;color:var(--acc);margin-top:var(--s1)}
.mhud .s{font-size:var(--tS);font-weight:800;letter-spacing:.12em;color:var(--blue)}
.mhud .c{font-size:2.6rem;font-weight:800;font-variant-numeric:tabular-nums;
  letter-spacing:-.045em;line-height:1.05;margin-top:var(--s1);color:var(--tx)}
#mirror.black .mhud{background:none;border:none;padding:0;transition:opacity .25s}
.mhint{position:absolute;left:3.5%;bottom:5%;color:#3a4250;
  font-size:var(--tXS);letter-spacing:.06em;transition:opacity .8s}

/* ---------- RESPONSIVE ---------- */
@media(max-width:900px){
  :root{--tD:2rem;--t1:1.5rem;--t2:1.2rem;--tL:1rem;--s7:28px;--s6:22px;--s5:18px}
  html{font-size:calc(17px * var(--fs))}
  .safe{inset:2% 4.5%}
  .body{grid-template-columns:1fr;grid-template-rows:auto 1fr;gap:var(--s4);overflow:auto}
  .figwrap{height:24vh}
  .info{overflow:visible}
  .tiles{grid-template-columns:1fr}
  .list{grid-template-columns:repeat(2,1fr);grid-auto-rows:minmax(5rem,auto)}
  .bar{flex-wrap:wrap;gap:var(--s3)}
  .ctrl{margin-left:0;width:100%;justify-content:flex-start}
  .btn.nav{display:inline-block}
  .btn.key i{display:none}
  .clock{font-size:2.2rem}
  .hero{padding:var(--s5) 0 var(--s4)}
}

</style>
</head>
<body>
<!-- HOME -->
<section id="home" class="screen on"><div class="safe">
  <div class="hero">
    <h1>Allenamento</h1>
    <div class="sub" id="today"></div>
  </div>
  <div class="tiles" id="tiles"></div>
</div></section>

<!-- LISTA -->
<section id="list" class="screen"><div class="safe">
  <div class="hdr"><span class="eyebrow" id="listSess"></span><span class="meta" id="listPos"></span></div>
  <div class="list" id="listRows"></div>
</div></section>

<!-- ESERCIZIO -->
<section id="ex" class="screen"><div class="safe">
  <div class="hdr"><span class="eyebrow" id="exSess"></span><span class="meta" id="exPos"></span></div>
  <div class="bars" id="bars"></div>
  <div class="body">
    <div class="figwrap" id="fig"></div>
    <div class="info">
      <h2 id="exName"></h2>
      <div class="dose" id="exDose"></div>
      <div class="target" id="exTarget"></div>
      <ul class="cues" id="exCues"></ul>
      <div class="err" id="exErr"></div>
      <div class="fix" id="exFix"></div>
    </div>
  </div>
  <div class="bar">
    <div class="status">
      <div class="clock" id="clock">--</div>
      <div><div class="side" id="sideLbl"></div><div class="sets" id="setDots"></div></div>
    </div>
    <div class="ctrl">
      <button class="btn nav" id="bPrev">◀</button>
      <button class="btn nav pri" id="bGo">Avvia</button>
      <button class="btn nav" id="bNext">▶</button>
      <button class="btn key" id="bSet"><i>▼</i> Conta</button>
      <button class="btn key" id="bMir"><i>▲</i> Specchio</button>
    </div>
  </div>
</div></section>

<!-- PROGRAMMA -->
<section id="doc" class="screen"><div class="safe">
  <div class="hdr"><span class="eyebrow">Il programma</span><span class="meta">▲▼ per scorrere</span></div>
  <div class="doc f" id="docBody" tabindex="0"></div>
</div></section>

<!-- SPECCHIO -->
<div id="mirror">
  <video id="mv" autoplay playsinline muted></video>
  <div class="mhint" id="mmsg" style="display:none"></div>
  <div class="mhud" id="mhud">
    <div class="a" id="mhA"></div><div class="b" id="mhB"></div>
    <div class="s" id="mhS"></div><div class="c" id="mhC"></div>
  </div>
</div>
<script>
/* ============ FIGURE ============ */
const SV = i => '<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">'
 + '<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4dd4c4"/></marker></defs>'
 + '<g fill="none" stroke="#e8edf5" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">'
 + i + '</g></svg>';
const GR = '<path d="M14 220 H226" stroke="#5a6b85" stroke-width="6"/>';
const HD = (x,y) => '<circle cx="'+x+'" cy="'+y+'" r="16" fill="#e8edf5" stroke="none"/>';
const AR = d => '<path d="'+d+'" stroke="#4dd4c4" stroke-width="6" marker-end="url(#ah)"/>';
const BD = d => '<path d="'+d+'" stroke="#4dd4c4" stroke-width="5" stroke-dasharray="11 8"/>';
const PR = d => '<path d="'+d+'" stroke="#5a6b85" stroke-width="7"/>';
/* i tre punti verdi sono il "treppiede": tallone, base dell'alluce, base del mignolo */
const FT = (x,y,r) => '<g transform="translate('+x+','+y+') rotate('+(r||0)+')">'
 + '<rect x="-16" y="-42" width="32" height="84" rx="16" fill="none" stroke="#e8edf5" stroke-width="7"/>'
 + '<circle cx="-8" cy="-26" r="5" fill="#4dd4c4" stroke="none"/>'
 + '<circle cx="8" cy="-26" r="5" fill="#4dd4c4" stroke="none"/>'
 + '<circle cx="0" cy="28" r="5" fill="#4dd4c4" stroke="none"/></g>';

const TOP='<text x="120" y="232" text-anchor="middle" fill="#5a6b85" stroke="none" font-size="15" font-family="sans-serif">vista dall\'alto · treppiede</text>';
const FIG = {
 marcia: SV(GR+HD(118,42)+'<path d="M118 58 V130"/><path d="M118 80 L96 108"/><path d="M118 80 L140 104"/>'
  +'<path d="M118 130 L108 176 L104 218"/><path d="M118 130 L152 138 L150 180"/>'+AR('M178 152 V114')),

 cervicale: SV(GR+HD(134,48)+'<path d="M120 68 V150"/><path d="M98 80 H142"/>'
  +'<path d="M142 80 L168 54 L142 36"/><path d="M98 80 L88 118"/>'
  +'<path d="M120 150 L106 218"/><path d="M120 150 L134 218"/>'+AR('M150 24 L142 46')),

 cervicale2: SV(GR+HD(128,50)
  +'<path d="M120 70 V150"/><path d="M98 82 H142"/>'
  +'<path d="M142 82 L172 54 L138 32"/><path d="M98 82 L88 120"/>'
  +'<path d="M120 150 L106 218"/><path d="M120 150 L134 218"/>'
  +BD('M114 64 L84 104')+AR('M154 20 L132 46')),

 bracciaLarghe: SV(GR+HD(120,44)
  +'<path d="M120 60 V140"/><path d="M120 82 L52 72"/><path d="M120 82 L188 72"/>'
  +'<path d="M52 72 L44 56"/><path d="M188 72 L196 56"/>'
  +'<path d="M120 140 L106 218"/><path d="M120 140 L134 218"/>'
  +AR('M40 46 L18 34')+AR('M200 46 L222 34')),

 ruotaspalle: SV(GR+HD(120,46)
  +'<path d="M120 62 V140"/><path d="M120 84 L94 134"/><path d="M120 84 L146 134"/>'
  +'<path d="M120 140 L106 218"/><path d="M120 140 L134 218"/>'
  +AR('M86 66 A 28 28 0 1 1 88 104')+AR('M154 66 A 28 28 0 1 0 152 104')),

 tronco: SV(GR+HD(120,42)+'<path d="M120 58 V132"/><path d="M120 80 L74 96"/><path d="M120 80 L166 96"/>'
  +'<path d="M120 132 L106 218"/><path d="M120 132 L134 218"/>'
  +AR('M60 74 A 62 26 0 0 1 178 74')),

 ileopsoas: SV(GR+PR('M38 26 V220')+HD(142,46)
  +'<path d="M142 62 V128"/><path d="M142 86 L60 94"/>'
  +'<path d="M142 128 L104 170 L100 218"/><path d="M142 128 L186 174 L208 214"/>'
  +AR('M164 130 A 30 30 0 0 1 136 156')
  +'<circle cx="176" cy="142" r="7" fill="#4dd4c4" stroke="none"/>'),

 ileopsoasresp: SV(GR+PR('M38 26 V220')+HD(142,46)
  +'<path d="M142 62 V128"/><path d="M142 86 L60 94"/>'
  +'<path d="M142 128 L104 170 L100 218"/><path d="M142 128 L186 174 L208 214"/>'
  +AR('M164 130 A 30 30 0 0 1 136 156')
  +AR('M176 74 V110')
  +'<circle cx="176" cy="142" r="7" fill="#4dd4c4" stroke="none"/>'),

 polpacci: SV(GR+PR('M42 26 V220')+HD(150,48)
  +'<path d="M150 64 V130"/><path d="M150 86 L58 88"/>'
  +'<path d="M150 130 L116 170 L112 218"/><path d="M150 130 L196 180 L214 218"/>'
  +AR('M214 200 L204 172')),

 caviglia: SV(GR+'<path d="M158 44 L150 176"/><path d="M150 178 L98 186"/><path d="M98 186 L80 190"/>'
  +BD('M20 208 L84 190')+AR('M92 176 L72 144')
  +'<circle cx="152" cy="180" r="6" fill="#5a6b85" stroke="none"/>'),

 tapping: SV(GR+'<path d="M158 44 L150 172"/><path d="M150 174 L150 194"/><path d="M150 194 L92 156"/>'
  +'<circle cx="152" cy="198" r="8" fill="#5a6b85" stroke="none"/>'+AR('M76 192 L70 150')),

 fUniti: SV(FT(102,116)+FT(138,116)+TOP),
 fSemi:  SV(FT(98,96)+FT(142,146)+TOP),
 fTandem:SV(FT(120,78)+FT(120,166)+TOP),

 mono: SV(GR+PR('M38 26 V220')+HD(142,44)
  +'<path d="M142 60 V128"/><path d="M142 84 L56 98"/>'
  +'<circle cx="48" cy="99" r="6" fill="#4dd4c4" stroke="none"/>'
  +'<path d="M142 128 L132 218"/><path d="M142 128 L178 142 L174 186"/>'
  +AR('M204 150 V116')),

 fenic: SV(GR+PR('M38 26 V220')+HD(142,44)
  +'<path d="M142 60 V128"/><path d="M142 84 L78 100"/>'+BD('M74 101 L46 105')
  +'<path d="M142 128 L132 218"/><path d="M142 128 L178 142 L174 186"/>'),

 disco: SV(GR+'<ellipse cx="120" cy="202" rx="56" ry="14" fill="none" stroke="#5a6b85" stroke-width="7"/>'
  +HD(122,42)+'<path d="M122 58 V132"/><path d="M122 82 L74 68"/><path d="M122 82 L170 68"/>'
  +'<path d="M122 132 L108 194"/><path d="M122 132 L136 194"/>'

 alzate: SV(GR+PR('M130 152 H220')+PR('M220 152 V86')+PR('M136 152 V216')+PR('M212 152 V216')

 suricato: SV(GR+PR('M42 26 V220')+HD(150,48)
  +'<path d="M150 64 V132"/><path d="M150 86 L58 90"/>'
  +'<path d="M150 132 L142 194 L168 212"/>'+AR('M188 196 V158')),

 stepup: SV(PR('M16 218 H100 V172 H172 V126 H224')
  +HD(112,44)+'<path d="M112 60 V128"/><path d="M112 88 L142 110"/>'
  +'<path d="M112 128 L136 150 L138 168"/><path d="M112 128 L82 176 L70 214"/>'
  +AR('M200 168 L200 122')),

 ginocchio: SV(GR+HD(116,42)+'<path d="M116 58 V130"/><path d="M116 80 L94 108"/><path d="M116 80 L138 104"/>'
  +'<path d="M116 130 L106 176 L102 218"/><path d="M116 130 L152 134 L150 178"/>'
  +AR('M180 150 V106')
  +'<path d="M186 168 H206 M190 182 H212 M194 196 H206" stroke="#4dd4c4" stroke-width="5"/>'),

let AC=null;
function beep(f,ms,v){ try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  const o=AC.createOscillator(), g=AC.createGain();
  o.frequency.value=f; o.type="sine"; o.connect(g); g.connect(AC.destination);
  g.gain.setValueAtTime(v||.18,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+ms/1000);
  o.start(); o.stop(AC.currentTime+ms/1000);}catch(e){} }
const bStart=()=>beep(660,140), bTick=()=>beep(880,70,.1), bEnd=()=>{beep(520,200);setTimeout(()=>beep(780,320),190)};

function setRing(els,cols){ S.ring=els.filter(Boolean); S.cols=cols||1; S.ri=0; focusRing(); }
function focusRing(){ if(!S.ring.length)return; S.ri=Math.max(0,Math.min(S.ri,S.ring.length-1));
  S.ring[S.ri].focus(); S.ring[S.ri].scrollIntoView({block:"nearest"}); }
function move(d){ const n=S.ring.length; if(!n)return;
  if(S.cols>1){ if(d==="l")S.ri--; else if(d==="r")S.ri++; else if(d==="u")S.ri-=S.cols; else S.ri+=S.cols; }
  else { if(d==="u"||d==="l")S.ri--; else S.ri++; }
  if(S.ri<0)S.ri=0; if(S.ri>=n)S.ri=n-1; focusRing(); }

function curEx(){ return SESS[S.key].ex[S.i]; }
function openEx(k,i){

  $("#setDots").innerHTML = tot>1 ? [...Array(tot)].map((_,i)=>'<i class="'+(i<S.set?"on":"")+'"></i>').join("") : "";
  paintClock();

/* se il testo non ci sta, rimpicciolisce finche' entra: niente frasi tagliate */
function fitInfo(){
  const el=document.querySelector("#ex .info"); if(!el) return;
  el.style.fontSize="";
  const base=parseFloat(getComputedStyle(el).fontSize);
  let s=1;
  while(el.scrollHeight>el.clientHeight+2 && s>0.56){ s-=0.04; el.style.fontSize=(base*s).toFixed(2)+"px"; }
}
addEventListener("resize",()=>{ if(S.screen==="ex") fitInfo(); });
function paintClock(){
  const e=curEx(), c=$("#clock");
  const g=$("#bGo"); if(g) g.textContent = T.id? "Pausa" : "Avvia";
  c.className="clock"+(T.mode==="hold"?" run":T.mode==="rest"?" rest":T.mode==="done"?" done"
                      :(e.free&&S.set>0)?" run":"");
  if(e.stop){ c.textContent=fmt(T.up); c.className="clock"+(T.id?" run":""); }
  else if(T.mode==="free"||(e.free&&T.mode==="idle")){ c.textContent = e.free? (S.set||0) : fmt(T.up); }
  else if(T.mode==="idle") c.textContent = e.t? fmt(e.t) : (e.rest? fmt(e.rest) : "--");
  else if(T.mode==="done") c.textContent="✓";
  else c.textContent=fmt(T.left);
  if($("#mirror").classList.contains("on")){
    $("#mhA").textContent=e.n; $("#mhB").textContent=e.d;
    $("#mhC").textContent=c.textContent;
    $("#mhS").textContent = e.sides===2 ? (S.side===0?"DESTRA":"SINISTRA")
                          : ((e.sets||1)>1 ? "serie "+Math.min(S.set+1,e.sets)+" / "+e.sets : "");
  }
}
const fmt=s=>{s=Math.max(0,Math.round(s));return (s>=60? Math.floor(s/60)+":"+String(s%60).padStart(2,"0") : String(s))};

function stopT(){ clearInterval(T.id); T.id=null; T.mode="idle"; T.up=0; }
function toggleT(){
  const e=curEx();
  if(T.id){ clearInterval(T.id); T.id=null; T.mode=T.mode==="hold"||T.mode==="rest"?"idle":T.mode; paintClock(); return; }
  if(e.stop){ T.mode="free"; bStart(); T.id=setInterval(()=>{T.up++;paintClock()},1000); paintClock(); return; }
  if(e.free){ T.mode="free"; T.up=0; bStart(); T.id=setInterval(()=>{T.up++;paintClock()},1000); paintClock(); return; }
  if(e.t){ T.mode="hold"; T.left=e.t; }
  else { T.mode="rest"; T.left=e.rest||75; }
  bStart(); paintClock(); runT();
}
function runT(){
  T.id=setInterval(()=>{ T.left--; if(T.left<=3&&T.left>0)bTick(); if(T.left<=0)endT(); paintClock(); },1000);
}
function endT(){
  clearInterval(T.id); T.id=null; bEnd();
  const e=curEx(), tot=e.sets||1;
  if(T.mode==="rest"){                       // fine recupero
    T.mode="idle";
    if(!e.t) S.set=Math.min(tot,S.set+1);    // esercizio a ripetizioni: una serie in meno
    renderEx();
    if(e.t && S.set<tot) setTimeout(()=>{ if(S.screen==="ex") toggleT(); },800);
    return;
  }
  if(T.mode!=="hold"){ T.mode="idle"; renderEx(); return; }
  if(e.sides===2 && S.side===0){             // cambia lato
    S.side=1; T.mode="idle"; renderEx();
    setTimeout(()=>{ if(S.screen==="ex") toggleT(); },1800); return;
  }
  S.side=0; S.set=Math.min(tot,S.set+1);
  if(S.set>=tot){ T.mode="done"; renderEx(); return; }
  if(e.rest){                                // tenuta + recupero (intervalli)
    T.mode="rest"; T.left=e.rest; renderEx(); runT(); return;
  }
  T.mode="idle"; renderEx();
  setTimeout(()=>{ if(S.screen==="ex") toggleT(); },2500);
}
function markSet(){
  const e=curEx();
  if(!e.free) return;
  S.set=(S.set||0)+1; store.set("cnt_"+e.n,S.set); renderEx(); bTick();
}
function goEx(d){ const n=SESS[S.key].ex.length; let i=S.i+d;
  if(i<0)i=0; if(i>=n)i=n-1;
  if(i===S.i) return;
  openEx(S.key,i); }

/* --- SPECCHIO --- */
let stream=null;
async function openMirror(){
  const m=$("#mirror"); m.classList.add("on");
  $("#mv").style.display=""; $("#mmsg").style.display="none";
  $("#mirror").classList.remove("black"); $("#mhud").style.opacity="1"; paintClock();
  try{document.activeElement.blur()}catch(e){}
  const hh=$("#mmsg"); hh.style.display="block"; hh.style.opacity="1";
  hh.innerHTML="OK avvia &nbsp;·&nbsp; ◀▶ esercizio &nbsp;·&nbsp; ▲▼ luminosità &nbsp;·&nbsp; Indietro esce";
  setTimeout(()=>{hh.style.opacity="0"},5000);
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){ return failMirror(); }
  try{ stream=await navigator.mediaDevices.getUserMedia({video:{width:{ideal:1280},facingMode:"user"},audio:false});
    $("#mv").srcObject=stream; $("#mmsg").style.display="none"; }
  catch(err){ failMirror(err); }
}
let hudLvl=3; const HUD=[0,.28,.55,1];
function applyHud(){ $("#mhud").style.opacity=HUD[hudLvl]; }
function failMirror(){
  $("#mv").style.display="none";
  $("#mirror").classList.add("black");
  hudLvl=3; applyHud();
  const h=$("#mmsg"); h.style.display="block"; h.style.opacity="1";
  h.innerHTML="OK avvia &nbsp;·&nbsp; ◀▶ esercizio &nbsp;·&nbsp; ▲▼ luminosità &nbsp;·&nbsp; Indietro esce";
  setTimeout(()=>{h.style.opacity="0"},5000);
}
function mirrorNav(d){
  const n=SESS[S.key].ex.length, i=S.i+d;
  if(i<0||i>=n) return;
  stopT(); S.i=i; S.side=0; S.set=0; renderEx(); paintClock();
}
function closeMirror(){ $("#mirror").classList.remove("on"); $("#mirror").classList.remove("black");
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}
  $("#mv").style.display=""; focusRing(); }

/* --- INDIETRO: un solo punto di verita' --- */
const BACKKEYS=["Escape","Backspace","GoBack","BrowserBack","XF86Back"];
const isBack=k=>BACKKEYS.indexOf(k)>=0;
/* Fire TV: tasti avanzamento e riavvolgimento veloce */
const FWD=["MediaFastForward","MediaTrackNext","FastForward","AudioTrackNext","Next"];
const RWD=["MediaRewind","MediaTrackPrevious","Rewind","AudioTrackPrevious","Previous"];
const isFwd=(k,c)=>FWD.indexOf(k)>=0||c===228||c===176||c===425;
const isRwd=(k,c)=>RWD.indexOf(k)>=0||c===227||c===177||c===424;
function goBack(){
  if($("#mirror").classList.contains("on")){ closeMirror(); return true; }
  stopT();
  if(S.screen==="ex"){ openList(S.key); return true; }
  if(S.screen!=="home"){ buildHome(); return true; }
  return false;
}

/* --- TASTI (telecomando Fire TV = frecce + OK + Indietro) --- */
document.addEventListener("keydown",ev=>{
  const k=ev.key;
  if($("#mirror").classList.contains("on")){
    ev.preventDefault();
    if(isBack(k)) closeMirror();
    else if(k==="Enter"||k===" "||k==="MediaPlayPause") toggleT();
    else if(k==="ArrowLeft"||isRwd(k,ev.keyCode)) mirrorNav(-1);
    else if(k==="ArrowRight"||isFwd(k,ev.keyCode)) mirrorNav(1);
    else if(k==="ArrowUp"){hudLvl=Math.min(3,hudLvl+1);applyHud();}
    else if(k==="ArrowDown"){hudLvl=Math.max(0,hudLvl-1);applyHud();}
    return;
  }
  if(S.screen==="doc" && (k==="ArrowUp"||k==="ArrowDown"||k==="ArrowLeft"||k==="ArrowRight")){
    ev.preventDefault();
    const d=$("#docBody"), step=Math.round(d.clientHeight*0.72);
    d.scrollBy({top:(k==="ArrowUp"||k==="ArrowLeft")?-step:step,behavior:"smooth"});
    return;
  }
  if(S.screen==="ex"){
    if(k==="ArrowLeft"){ev.preventDefault(); goEx(-1); return;}
    if(k==="ArrowRight"){ev.preventDefault(); goEx(1); return;}
    if(k==="ArrowUp"){ev.preventDefault(); openMirror(); return;}
    if(k==="ArrowDown"){ev.preventDefault(); curEx().free? markSet() : (stopT(),renderEx()); return;}
    if(k==="Enter"||k===" "){ev.preventDefault(); toggleT(); return;}
  }
  if(k==="ArrowUp"){ev.preventDefault();move("u")}
  else if(k==="ArrowDown"){ev.preventDefault();move("d")}
  else if(k==="ArrowLeft"){ev.preventDefault();move("l")}
  else if(k==="ArrowRight"){ev.preventDefault();move("r")}
  else if(k==="Enter"||k===" "){ /* il focus gestisce il click */ }
  else if(isBack(k)){ ev.preventDefault(); goBack(); }
  else if(isFwd(k,ev.keyCode)){ev.preventDefault(); if(S.screen==="ex") goEx(1);}
  else if(isRwd(k,ev.keyCode)){ev.preventDefault(); if(S.screen==="ex") goEx(-1);}
  else if(k==="MediaPlayPause"||k==="p"){ev.preventDefault(); toggleT();}
  else if(k==="m"){ev.preventDefault(); if(S.screen==="ex")openMirror();}
});
/* Su Fire TV il tasto Indietro di Silk arriva come navigazione del browser,
   non come tasto: lo intercettiamo qui e lo trattiamo come "indietro" interno. */
try{

}catch(e){}

 <tr><td><b>2</b></td><td>Occhi aperti, <b>testa che ruota lenta</b> — il livello più utile: per strada la testa si muove sempre</td></tr>
 <tr><td><b>3</b></td><td>Occhi chiusi</td></tr>
 <tr><td><b>4</b></td><td>Occhi chiusi su superficie cedevole</td></tr>
 <tr><td><b>5</b></td><td>Una qualsiasi + conta all'indietro da 100 a passi di 3</td></tr></table>
 <p>Si sale <b>dopo 3 sessioni pulite</b>, non prima.</p>

 <h3>Quanto devo faticare</h3>
 <p>Scala da 1 a 10, dove 1 è stare seduto e 10 il massimo assoluto. È il riferimento più affidabile che hai.</p>
 <table><tr><th>Cosa</th><th>Sforzo</th><th>Come lo riconosci</th></tr>
 <tr><td>Riscaldamento</td><td><b>3</b></td><td>Chiacchieri senza problemi</td></tr>
 <tr><td>Cyclette · blocco</td><td><b>5-6</b></td><td>Respiro accelerato: frase corta sì, conversazione no</td></tr>
 <tr><td>Cyclette · recupero</td><td><b>2-3</b></td><td>Gambe che girano, respiro che si calma</td></tr>
 <tr><td>Camminata</td><td><b>5-6</b></td><td>Passo deciso. Se puoi cantare, vai troppo piano</td></tr>
 <tr><td>Forza</td><td><b>7</b></td><td>Chiudi la serie sentendo di poterne fare ancora 2-3. E ti fermi appena rallenti</td></tr>
 <tr><td>Equilibrio</td><td>—</td><td>Non è fatica, è <b>instabilità</b>: devi oscillare. Se non oscilli mai, è troppo facile</td></tr>
 <tr><td>Stretching</td><td><b>6</b></td><td>Tensione, mai dolore. Se stringi i denti sei oltre</td></tr></table>
 <p><b>Non andare mai a cedimento.</b> Nella SM allenarsi fino a non farcela più non produce adattamento in più: produce schemi peggiori e giorni di recupero.</p>
 <p><b>Sulla frequenza cardiaca:</b> se hai un orologio, il moderato sta intorno al 60-70% della frequenza massima stimata (220 meno la tua età). Ma nella SM il cuore può rispondere in modo poco affidabile — la disfunzione del sistema autonomo è comune — quindi se il numero e la sensazione non concordano, <b>fidati della sensazione</b>.</p>

 <h3>Progressione — quattro numeri</h3>
 <table><tr><th>Ogni 2 settimane</th><th></th></tr>
 <tr><td>Caviglia</td><td>Il numero della serie B deve salire. Segnalo ogni lunedì</td></tr>
 <tr><td>Equilibrio</td><td>Un esercizio sale di livello</td></tr>
 <tr><td>Forza</td><td>Prima le ripetizioni (10-12), poi il carico. Suricato: zaino solo a 3×20 senza rallentare</td></tr>
 <tr><td>Camminata</td><td>+10% sui blocchi: 700 → 770 → 850 → 930</td></tr>
 <tr><td>Cyclette</td><td>Parti da 4 intervalli, +1 ogni 2 settimane fino a 6. Poi allunga i blocchi da 3' a 4'</td></tr></table>
 <p>Fare gli stessi esercizi identici per due anni mantiene, non migliora. <b>Ogni 2 settimane qualcosa deve diventare più difficile.</b></p>

 <h3>Da aggiungere più avanti — a criterio, non a calendario</h3>
 <table><tr><th>Quando</th><th>Aggiungi</th></tr>
 <tr><td>Monopodalico con dito al muro 40" per lato, tranquillo</td><td>Passo di recupero volontario</td></tr>
 <tr><td>Fenicottero 20" senza appoggio</td><td>Perturbazione con peso (3-5 kg)</td></tr>
 <tr><td>Livello 3 stabile sul tandem</td><td>Dual task durante la tenuta</td></tr></table>

 <h3>Semaforo</h3>
 <p><b>🟢 Verde</b> — programma pieno.</p>
 <p><b>🟡 Giallo</b> (stanco, caldo, notte storta) — solo Sblocco + Caviglia, 11 minuti. Niente pomeriggio. 2 blocchi di camminata tranquilli.</p>
 <p><b>🔴 Rosso</b> (molto stanco, febbre, caldo estremo) — solo stretching e respirazione, 15 minuti.</p>
 <p><b>Il minimo sindacale sono gli 11 minuti di Sblocco + Caviglia.</b> Quelli si fanno sempre, il resto è negoziabile. Una giornata gialla non è un fallimento: il danno lo fa la settimana saltata del tutto.</p>
 <p>Se una sessione ti lascia il cammino peggiorato per più di 24-48 ore, hai fatto troppo: taglia il volume del 30% per due settimane.</p>

 <h3>Da portare al fisioterapista</h3>
 <p>Il tiraggio inguinale destro sull'ileopsoas · il cammino sui talloni (recluta gli estensori delle dita, decidetelo insieme) · il blocco reattivo quando lo introdurrai.</p>
